<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Coffee House</title>
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <a class="header__logo-link logo" href="#">
          <img
            class="logo__img"
            src="images/logo.svg"
            alt="Coffee House Logo"
          />
          <img
            class="logo__img logo__img--dark"
            src="images/logo-dark.svg"
            alt="Coffee House Logo"
          />
        </a>
        <nav class="header__menu hidden-tablet">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a class="header__menu-link" href="">Favorite coffee</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="">About</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="">Mobile app</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <button
            class="header__theme-switch theme-switch"
            type="button"
            aria-label="Switch the color theme"
          >
            <div
              class="theme-switch__icon-wrapper theme-switch__icon-wrapper--sun"
            >
              <svg
                class="theme-switch__icon theme-switch__icon--sun"
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
              >

                  fill="#E1D4C9"
                />
              </svg>
            </div>
            <div
              class="theme-switch__icon-wrapper theme-switch__icon-wrapper--moon"
            >
              <svg
                class="theme-switch__icon theme-switch__icon--moon"
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
              >
                <path
                  d="M9 0C4.03 0 0 4.03 0 9C0 13.97 4.03 18 9 18C13.97 18 18 13.97 18 9C18 8.54 17.96 8.08 17.9 7.64C16.92 9.01 15.32 9.9 13.5 9.9C10.52 9.9 8.1 7.48 8.1 4.5C8.1 2.69 8.99 1.08 10.36 0.0999999C9.92 0.0399999 9.46 0 9 0Z"
                  fill="#403F3D"
                />
              </svg>
            </div>
          </button>
          <a class="header__menu-item header__catalog-link hidden-tablet" href=""
            >Menu
            <svg
              class="header__catalog-icon"
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
            >
              <path

                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

                stroke-linejoin="round"
              />
              <path
                d="M13.333 9.16675H15.4163C16.5669 9.16675 17.4997 10.0995 17.4997 11.2501C17.4997 12.4007 16.5669 13.3334 15.4163 13.3334H14.1663"
                stroke="#403F3D"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
          <button
            class="heading__burger-button burger-button visible-tablet"
            type="button"
            onclick="mobileOverlay.showModal()"
            aria-label="Open navigation menu"
          ></button>
        </div>
      </div>
    </header>
    <dialog class="mobile-overlay visible-tablet" id="mobileOverlay">
      <header class="mobile-overlay__header">
        <a class="mobile-overlay__logo-link logo" href="#">
          <img
            class="logo__img"
            src="images/logo.svg"
            alt="Coffee House Logo"
          />
          <img
            class="logo__img logo__img--dark"
            src="images/logo-dark.svg"
            alt="Coffee House Logo"
          />
        </a>
        <div class="mobile-overlay__actions">
          <button
            class="mobile-overlay__theme-switch theme-switch"
            type="button"
            aria-label="Switch the color theme"
          >
            <div
              class="theme-switch__icon-wrapper theme-switch__icon-wrapper--sun"
            >
              <svg
                class="theme-switch__icon theme-switch__icon--sun"
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
              >
                <path
                  d="M10 3V1C10 0.45 10.45 0 11 0C11.55 0 12 0.45 12 1V3C12 3.55 11.55 4 11 4C10.45 4 10 3.55 10 3ZM17.36 6.05L18.77 4.63C19.16 4.24 19.16 3.61 18.77 3.22C18.38 2.83 17.75 2.83 17.36 3.22L15.95 4.64C15.56 5.03 15.56 5.66 15.95 6.05C16.34 6.44 16.97 6.44 17.36 6.05ZM21 10H19C18.45 10 18 10.45 18 11C18 11.55 18.45 12 19 12H21C21.55 12 22 11.55 22 11C22 10.45 21.55 10 21 10ZM11 18C10.45 18 10 18.45 10 19V21C10 21.55 10.45 22 11 22C11.55 22 12 21.55 12 21V19C12 18.45 11.55 18 11 18ZM4.64 6.05L3.22 4.64C2.83 4.25 2.83 3.61 3.22 3.23C3.61 2.85 4.25 2.84 4.63 3.23L6.04 4.64C6.43 5.03 6.43 5.67 6.04 6.05C5.65 6.43 5.02 6.44 4.64 6.05ZM15.95 15.95C15.56 16.34 15.56 16.98 15.95 17.36L17.36 18.77C17.75 19.16 18.39 19.16 18.77 18.77C19.16 18.38 19.16 17.74 18.77 17.36L17.36 15.95C16.98 15.56 16.34 15.56 15.95 15.95ZM1 12H3C3.55 12 4 11.55 4 11C4 10.45 3.55 10 3 10H1C0.45 10 0 10.45 0 11C0 11.55 0.45 12 1 12ZM4.64 18.78L6.05 17.37C6.44 16.98 6.44 16.34 6.05 15.96C5.66 15.58 5.02 15.57 4.64 15.96L3.23 17.37C2.84 17.76 2.84 18.4 3.23 18.78C3.61 19.17 4.25 19.17 4.64 18.78ZM11 5C7.69 5 5 7.69 5 11C5 14.31 7.69 17 11 17C14.31 17 17 14.31 17 11C17 7.69 14.31 5 11 5Z"
                  fill="#E1D4C9"
                />
              </svg>
            </div>
            <div
              class="theme-switch__icon-wrapper theme-switch__icon-wrapper--moon"
            >
              <svg
                class="theme-switch__icon theme-switch__icon--moon"
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
              >
                <path
                  d="M9 0C4.03 0 0 4.03 0 9C0 13.97 4.03 18 9 18C13.97 18 18 13.97 18 9C18 8.54 17.96 8.08 17.9 7.64C16.92 9.01 15.32 9.9 13.5 9.9C10.52 9.9 8.1 7.48 8.1 4.5C8.1 2.69 8.99 1.08 10.36 0.0999999C9.92 0.0399999 9.46 0 9 0Z"
                  fill="#403F3D"
                />
              </svg>
            </div>
          </button>
          <form class="mobile-overlay__close-button-wrapper" method="dialog">
            <button
              class="mobile-overlay__close-button"
              type="submit"
              aria-label="Close navigation menu"
            ></button>
          </form>
        </div>
      </header>
      <body class="mobile-overlay__body">
        <nav class="mobile-overlay__menu">
          <ul class="mobile-overlay__menu-list">
            <li class="mobile-overlay__menu-item">
              <a class="mobile-overlay__menu-link" href="">Favorite coffee</a>
            </li>
            <li class="mobile-overlay__menu-item">
              <a class="mobile-overlay__menu-link" href="">About</a>
            </li>
            <li class="mobile-overlay__menu-item">
              <a class="mobile-overlay__menu-link" href="">Mobile app</a>
            </li>
            <li class="mobile-overlay__menu-item">
              <a class="mobile-overlay__menu-link" href="">Contact us</a>
            </li>
            <li class="mobile-overlay__menu-item">
              <a class="mobile-overlay__menu-link" href=""

                  />
                  <path

                    stroke="#403F3D"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M26.6665 18.3334H30.8332C33.1344 18.3334 34.9998 20.1989 34.9998 22.5C34.9998 24.8012 33.1344 26.6667 30.8332 26.6667H28.3332"

                    stroke-width="2"

                  />
                </svg>
              </a>
            </li>
          </ul>
        </nav>
      </body>
    </dialog>
    <script src="index.js"></script>
  </body>
</html>
